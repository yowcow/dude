name: ci

# push and pull_request both. A same-repository pull request therefore produces
# two runs of each job; both have to pass, so the duplication costs runner time
# and nothing else.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

# `make lint test` plus `make manifest` by hand runs exactly what the gate runs.
# The jobs are separate so a lint failure and a test failure are distinguishable
# at a glance instead of one masking the other.
jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA by `pinact run .github/workflows/ci.yml`;
      # the trailing comment is the tag it resolved, and re-running pinact is
      # how to bump it. A mutable tag like @v7 would let the action's content
      # change under us without the workflow changing at all.
      #
      # v7 rather than v4: v4 runs on Node 20, which the runners now force onto
      # Node 24 while emitting a deprecation annotation on every single run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the runner image (0.9.0 on ubuntu-24.04,
      # the same version this was developed against). lint.sh prints the version
      # it used, so a future image bump is diagnosable from the log.
      - name: make lint
        run: make lint

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make test
        run: make test

  manifest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install manifest validators
        run: |
          python3 -m venv "$HOME/.venv-manifest"
          "$HOME/.venv-manifest/bin/pip" install --disable-pip-version-check 'PyYAML==6.0.2'
          echo "$HOME/.venv-manifest/bin" >> "$GITHUB_PATH"
          npm install --global @anthropic-ai/claude-code@2.1.268
          mkdir -p "$HOME/.codex/skills/.system/plugin-creator/scripts"
          curl --fail --location --output "$HOME/.codex/skills/.system/plugin-creator/scripts/validate_plugin.py" \
            https://raw.githubusercontent.com/openai/codex/6b9826e3aa83b1a5947db50f4332cb9c65f1b340/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          curl --fail --location --output "$HOME/.codex/skills/.system/plugin-creator/scripts/identifier_validation.py" \
            https://raw.githubusercontent.com/openai/codex/6b9826e3aa83b1a5947db50f4332cb9c65f1b340/codex-rs/skills/src/assets/samples/plugin-creator/scripts/identifier_validation.py

      - name: make manifest
        run: make manifest

  manifest-latest:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install latest manifest validators
        run: |
          python3 -m venv "$HOME/.venv-manifest"
          "$HOME/.venv-manifest/bin/pip" install --disable-pip-version-check 'PyYAML==6.0.2'
          echo "$HOME/.venv-manifest/bin" >> "$GITHUB_PATH"
          npm install --global @anthropic-ai/claude-code@latest
          codex_tag="$(GH_TOKEN="${{ github.token }}" gh api https://api.github.com/repos/openai/codex/releases/latest --jq .tag_name)"
          mkdir -p "$HOME/.codex/skills/.system/plugin-creator/scripts"
          base_url="https://raw.githubusercontent.com/openai/codex/${codex_tag}/codex-rs/skills/src/assets/samples/plugin-creator/scripts"
          curl --fail --location --output "$HOME/.codex/skills/.system/plugin-creator/scripts/validate_plugin.py" "$base_url/validate_plugin.py"
          curl --fail --location --output "$HOME/.codex/skills/.system/plugin-creator/scripts/identifier_validation.py" "$base_url/identifier_validation.py"

      - name: make manifest
        run: make manifest
