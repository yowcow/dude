name: ci

# push and pull_request both. A same-repository pull request therefore produces
# two runs of each job; both have to pass, so the duplication costs runner time
# and nothing else.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

# `make lint test` plus `make manifest` by hand runs exactly what the gate runs.
# The jobs are separate so a lint failure and a test failure are distinguishable
# at a glance instead of one masking the other.
jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA by `pinact run .github/workflows/ci.yml`;
      # the trailing comment is the tag it resolved, and re-running pinact is
      # how to bump it. A mutable tag like @v7 would let the action's content
      # change under us without the workflow changing at all.
      #
      # v7 rather than v4: v4 runs on Node 20, which the runners now force onto
      # Node 24 while emitting a deprecation annotation on every single run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the runner image (0.9.0 on ubuntu-24.04,
      # the same version this was developed against). lint.sh prints the version
      # it used, so a future image bump is diagnosable from the log.
      - name: make lint
        run: make lint

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make test
        run: make test

  # bash 3.2 is the floor the scripts under skills/<skill>/scripts/ and the
  # hooks must run on (AGENTS.md; hooks/session-start), and the image ships
  # 5.x: a 3.2-only regression is green in the jobs above and broken wherever
  # a macOS user's /bin/bash runs it. The version is asserted in the step that
  # runs the suite because a PATH that slipped would measure bash 5 and report
  # the same green.
  test-bash32:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build bash 3.2.57
        run: |
          set -o pipefail
          curl -fsSL --retry 3 --retry-connrefused \
            -o "$RUNNER_TEMP/bash-3.2.57.tar.gz" \
            https://ftp.gnu.org/gnu/bash/bash-3.2.57.tar.gz
          printf '%s  %s\n' \
            '3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4' \
            "$RUNNER_TEMP/bash-3.2.57.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bash-3.2.57.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bash-3.2.57"
          # This release's config.guess does not recognise aarch64, so the
          # triplet is derived from uname rather than guessed; this job runs
          # x86_64, where both give x86_64-unknown-linux-gnu.
          # C23 reads `f ()` as `f (void)`, and this release declares
          # list_reverse () while calling it with an argument (general.h:129);
          # gcc 15, which ubuntu-latest moves to, defaults to gnu23, so the
          # dialect is pinned.
          triplet="$(uname -m)-unknown-linux-gnu"
          CFLAGS="-O2 -std=gnu89" ./configure \
            --build="$triplet" --host="$triplet" \
            --without-bash-malloc --disable-nls
          make
          echo "$RUNNER_TEMP/bash-3.2.57" >> "$GITHUB_PATH"

      - name: make test (bash 3.2)
        run: |
          bash --version | head -1
          got="$(bash -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')"
          if [ "$got" != 3.2 ]; then
            echo "bash on PATH is $got, not 3.2 — the suite below would measure the image's bash" >&2
            exit 1
          fi
          make test

  manifest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install manifest validators
        run: |
          set -o pipefail
          npm install --global @anthropic-ai/claude-code@2.1.268
          # No version pin: unlike claude-code (npm tag), muse ships only the
          # stable channel via this installer.
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make manifest
        run: make manifest

  manifest-latest:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install latest manifest validators
        run: |
          set -o pipefail
          npm install --global @anthropic-ai/claude-code@latest
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make manifest
        run: make manifest
